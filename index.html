<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Link-preview tags for crawlers that skip JS. scripts/prerender.mjs rewrites
         these per route at build time; useMeta keeps them current after navigation. -->
    <title>Anuar Afiq</title>
    <meta name="description" content="Anuar Afiq - computer science student building web apps, games, and tools. Based in Malaysia." />
    <meta property="og:site_name" content="Anuar Afiq" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Anuar Afiq" />
    <meta property="og:description" content="Anuar Afiq - computer science student building web apps, games, and tools. Based in Malaysia." />
    <meta property="og:image" content="https://anuarafiq.me/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Anuar Afiq" />
    <meta name="twitter:description" content="Anuar Afiq - computer science student building web apps, games, and tools. Based in Malaysia." />
    <meta name="twitter:image" content="https://anuarafiq.me/og-image.png" />
    <!-- Structured data: a data block, not executed, so the CSP script hash doesn't cover it -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Anuar Afiq",
        "alternateName": "Anuar Afiq Arfahairy",
        "url": "https://anuarafiq.me",
        "image": "https://anuarafiq.me/og-image.png",
        "jobTitle": "Computer Science Student",
        "affiliation": { "@type": "CollegeOrUniversity", "name": "Universiti Teknologi PETRONAS" },
        "address": { "@type": "PostalAddress", "addressCountry": "MY" },
        "sameAs": ["https://github.com/anuarafiq", "https://linkedin.com/in/anuar-afiq-arfahairy-234964314"]
      }
    </script>
    <!-- Editorial font pairing: Cormorant Garamond (high-contrast serif) + IBM Plex Mono (technical) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=IBM+Plex+Mono:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Apply saved theme before React mounts to prevent flash -->
    <script>
      ;(function () {
        var t = localStorage.getItem('theme')
        if (t) document.documentElement.setAttribute('data-theme', t)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
